[package]
name = "beacon"
version = "0.1.0"
edition = "2021"
description = "Beacon — uptime monitoring + public status page + SSO admin for the Steadholme stack."
license = "MIT OR Apache-2.0"

[lib]
name = "beacon"
path = "src/lib.rs"

[[bin]]
name = "beacon"
path = "src/main.rs"

[dependencies]
# Vendored Odyssey canonical CSS (font + tokens + shared components) for server-rendered pages.
odyssey = { path = "crates/odyssey" }
# HTTP framework (shared with keystone/keyward): Json/Form/State extractors, typed responses.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers (and the background prober)
# `.await` it directly and PgStore drives sqlx natively, so a worker thread is NEVER blocked
# (no sync-over-async bridge). `rt-multi-thread` keeps the serving runtime parallel for
# concurrent reads under probe load; the prober fans checks out concurrently; `net`/`time`/
# `io-util` back the raw TCP/HTTP probes.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (handlers + the
# prober depend only on the trait, exactly like the keystone/keyward seam).
async-trait = "0.1"
# (De)serialize request/response bodies + the BEACON_SEED config + JSON status API.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error enum -> JSON error envelope.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). Standard SQL only, so it
# later runs unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# CSPRNG bytes for the double-submit CSRF token + subscriber ids/secrets. `getrandom` is a
# tiny libc-backed shim and `hex` encodes the bytes (the same pair lodestar/inkwell/watchtower
# use).
getrandom = "0.2"
hex = "0.4"
# HMAC-SHA256 for signing outbound webhook payloads (pure Rust, NO OpenSSL) — the same
# `Hmac<Sha256>` pair eddy/relay/sanctum use for signed URLs and gateway identity.
hmac = "0.12"
sha2 = "0.10"
# Calendar formatting for the RSS feed (RFC 822 pubDate) and the 90-day uptime bar labels.
# std-only, no macros/locales — mirrors inkwell's feed.
time = { version = "0.3", default-features = false, features = ["std"] }
# TLS client for HTTPS probes. rustls with the `ring` backend (NOT aws-lc-rs) avoids the
# C/cmake toolchain — the same portability choice keystone/keyward made. `webpki-roots`
# bundles the Mozilla trust anchors so the runtime image needs no system CA store for
# outbound probing.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
