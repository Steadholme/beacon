<!DOCTYPE html>
<html lang="{{LANG}}"{{THEME}} data-ody-profile="public">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <meta name="description" content="Live availability of the Steadholme sovereign infrastructure.">
  <meta http-equiv="refresh" content="300">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Cpath stroke='%23b6422c' stroke-width='3' d='M24 4 8 9.5V22c0 11 7 17.4 16 21.5C33 39.4 40 33 40 22V9.5L24 4Z'/%3E%3C/svg%3E">
  <link rel="alternate" type="application/rss+xml" href="/feed.xml">
  <title>Status · Steadholme</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console" data-ody-shell="1.2">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/status" aria-label="Steadholme status home">
        <span class="brand__glyph" aria-hidden="true">{{SHIELD}}</span>
        <span class="brand__word">Steadholme</span>
      </a>
      <div class="topbar__right">
        {{THEMESWITCH}}
        {{USERBOX}}
        {{LANGSWITCH}}
      </div>
    </div>
  </header>

  <main class="console">
    <div class="console__head statushead">
      <div class="statushead__text">
        <h1>{{STATUS_TITLE}}</h1>
        <p class="sub">{{STATUS_SUB}}</p>
      </div>
      <div class="statushead__actions">
        {{PUBLIC_SIGNAL}}
        {{REFRESH}}
        <details class="updates-pop">
          <summary class="btn btn-secondary updates-pop__btn">{{GET_UPDATES}}</summary>
          <nav class="updates-pop__menu">
            {{WEBHOOK_LINK}}
            <a class="updates-pop__item" href="/feed.xml">{{RSS_FEED}}</a>
            <a class="updates-pop__item" href="/api/status">{{JSON_API}}</a>
          </nav>
        </details>
      </div>
    </div>

    {{STATUS_LIVE}}

    {{SUBSCRIBE}}
  </main>

  <footer class="site-foot">
    <span>{{FOOTER}}</span>
    <span class="site-foot__links"><a href="/feed.xml">{{RSS}}</a> · <a href="/api/status">{{JSON_API}}</a> · {{UPDATED_LABEL}}</span>
  </footer>
  {{SCRIPTS}}
</body>
</html>
