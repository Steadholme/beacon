<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Beacon admin · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/admin" aria-label="HOLDFAST Beacon admin">
        <span class="brand__glyph" aria-hidden="true">{{SHIELD}}</span>
        <span class="brand__word">HOLDFAST</span>
      </a>
      <div class="topbar__right">
        {{USERBOX}}
      </div>
    </div>
  </header>

  <main class="console">
    <div class="console__head">
      <h1>Beacon admin</h1>
      <p class="sub">Signed in as {{EMAIL}}. Monitored checks and incident control.</p>
    </div>

    <div class="card-stack">
      <section class="card">
        <div class="card__head"><h2>Monitored checks</h2></div>
        <div class="card__body">
          <table class="table">
            <thead>
              <tr><th>Component</th><th>Kind</th><th>Target</th><th>Current</th></tr>
            </thead>
            <tbody>
              {{CHECKS}}
            </tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="card__head"><h2>Post an incident</h2></div>
        <div class="card__body">
          <form method="post" action="/admin/incidents">
            <input type="hidden" name="csrf_token" value="{{CSRF}}">
            <div class="field">
              <label for="title">Title</label>
              <input type="text" id="title" name="title" required placeholder="e.g. Identity provider degraded">
            </div>
            <div class="field">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="investigating">Investigating</option>
                <option value="identified">Identified</option>
                <option value="monitoring">Monitoring</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>
            <div class="field">
              <label for="severity">Severity</label>
              <select id="severity" name="severity">
                <option value="minor">Minor</option>
                <option value="major">Major</option>
                <option value="critical">Critical</option>
              </select>
            </div>
            <div class="field">
              <label for="affected">Affected components</label>
              <input type="text" id="affected" name="affected" placeholder="Comma-separated component names, e.g. Gateway, Identity">
            </div>
            <div class="field">
              <label for="body">Details</label>
              <textarea id="body" name="body" placeholder="What is happening and what is being done."></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Publish incident</button>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card__head"><h2>Recent incidents</h2></div>
        <div class="card__body">
          {{INCIDENTS}}
        </div>
      </section>

      <section class="card">
        <div class="card__head"><h2>Schedule maintenance</h2></div>
        <div class="card__body">
          <form method="post" action="/admin/maintenances">
            <input type="hidden" name="csrf_token" value="{{CSRF}}">
            <div class="field">
              <label for="m-title">Title</label>
              <input type="text" id="m-title" name="title" required placeholder="e.g. Database upgrade">
            </div>
            <div class="field">
              <label for="m-body">Details</label>
              <textarea id="m-body" name="body" placeholder="What is being maintained and expected impact."></textarea>
            </div>
            <div class="field">
              <label for="m-starts">Starts in (minutes, 0 = now)</label>
              <input type="text" id="m-starts" name="starts_in_mins" value="0">
            </div>
            <div class="field">
              <label for="m-duration">Duration (minutes)</label>
              <input type="text" id="m-duration" name="duration_mins" value="60">
            </div>
            <div class="field">
              <label for="m-affected">Affected components</label>
              <input type="text" id="m-affected" name="affected" placeholder="Comma-separated component names, e.g. Gateway">
            </div>
            <button class="btn btn-primary" type="submit">Schedule window</button>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card__head"><h2>Maintenance windows</h2></div>
        <div class="card__body">
          {{MAINTENANCES}}
        </div>
      </section>
    </div>
  </main>
</body>
</html>
